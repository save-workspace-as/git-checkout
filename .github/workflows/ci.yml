name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: git-checkout-vsix
          path: gitcheckout-*.vsix
          if-no-files-found: error
          retention-days: 14

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs', 'package-lock.json') }}
      - name: Run e2e tests
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            log="e2e-attempt-${attempt}.log"
            display=99
            while [ -e "/tmp/.X${display}-lock" ]; do
              display=$((display + 1))
            done
            # ubuntu-latest has no X server. Own the Xvfb process so its
            # temp-dir cleanup cannot replace the test runner's exit code.
            Xvfb ":${display}" -screen 0 1280x1024x24 -ac +extension GLX +render -noreset >xvfb.log 2>&1 &
            xvfb_pid=$!
            export DISPLAY=":${display}"
            set +e
            npm run test:e2e >"$log" 2>&1
            status=$?
            set -e
            kill "$xvfb_pid" >/dev/null 2>&1 || true
            wait "$xvfb_pid" >/dev/null 2>&1 || true
            cat "$log"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Failed to download and unzip VS Code|Failed to get VS Code archive location|Error retrieving VS Code versions|ETIMEDOUT|ECONNRESET|ENOTFOUND|EAI_AGAIN|ECONNREFUSED|socket hang up|detected unresponsive|renderer process gone' "$log"; then
              exit "$status"
            fi
            echo "VS Code failed to start (attempt ${attempt}); retrying"
            sleep $((attempt * 15))
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: e2e-attempt-*.log
          if-no-files-found: ignore
          retention-days: 14
