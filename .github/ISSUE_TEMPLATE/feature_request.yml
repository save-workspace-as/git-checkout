name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or workflow, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. If VS Code or Git already has a way to do it, say what is missing.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
